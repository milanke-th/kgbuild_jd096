[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "milanke-th-kgbuild_jd096"
version = "0.1.0"
description = "从输入中抽取数值，计算知识图谱构建工程师·模型热切换的一致性相关的比值与占比，分母为零时明确报错"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "milanke-th" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://milanke-th.github.io"
Repository = "https://github.com/milanke-th/kgbuild_jd096"
Issues = "https://github.com/milanke-th/kgbuild_jd096/issues"

[project.scripts]
kgbuild_jd096 = "kgbuild_jd096:main"

[tool.setuptools]
py-modules = ["kgbuild_jd096"]
